---
name: DevOps Mastery CI

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Lint, Validate and Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Markdown Lint
        uses: avto-dev/markdown-lint@v1

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3

      - name: Check Broken Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --timeout 30
            --max-retries 4
            --retry-wait-time 3
            --max-concurrency 8
            --host-concurrency 2
            --host-request-interval 1s
            .
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          failIfEmpty: true
          format: markdown
          output: lychee/out.md
          jobSummary: true

      - name: Upload Link Report on Failure
        if: failure() && hashFiles('lychee/out.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: lychee/out.md
          if-no-files-found: ignore
          retention-days: 5
